# Vhost para el main_nginx del servidor.
#
# Va en la carpeta de configuración de ese contenedor (la que tenga montada
# desde el host), no dentro de este stack. Después: `docker exec main_nginx
# nginx -s reload`.

server {
    listen 80;
    server_name kuenta.otech-labs.com;

    # Deja pasar la validación de certbot y manda el resto a HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name kuenta.otech-labs.com;

    ssl_certificate     /etc/letsencrypt/live/kuenta.otech-labs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kuenta.otech-labs.com/privkey.pem;

    client_max_body_size 8m;

    location / {
        # Por nombre de contenedor: main_nginx y gastos-web comparten red.
        proxy_pass http://gastos-web:80;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Sin esta cabecera Laravel vería siempre la IP del proxy, y el límite
        # de intentos de login pasaría a ser global en vez de por IP.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
