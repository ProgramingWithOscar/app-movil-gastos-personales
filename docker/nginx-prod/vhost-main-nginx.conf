# Vhost para el main_nginx del servidor.
#
# Va en /var/www/nginx-proxy/sites/kuenta.otech-labs.com.conf
# Después:  docker exec main_nginx nginx -t && docker exec main_nginx nginx -s reload

server {
    listen 80;
    server_name kuenta.otech-labs.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kuenta.otech-labs.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name kuenta.otech-labs.com;

    ssl_certificate     /etc/letsencrypt/live/kuenta.otech-labs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kuenta.otech-labs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8M;

    location / {
        # Por nombre de contenedor, no por 172.17.0.1 como cv-ai: `gastos-web`
        # comparte la red `valiu_net` con este proxy, así que no necesita
        # publicar ningún puerto al exterior. Un puerto publicado sería una
        # puerta de entrada que se salta el HTTPS.
        proxy_pass http://gastos-web:80;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Sin esta cabecera Laravel vería siempre la IP del proxy, y el límite
        # de 5 intentos de login pasaría a ser global en vez de por IP.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
