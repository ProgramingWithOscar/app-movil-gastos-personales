<ion-content [fullscreen]="true" class="onb-pantalla">
  <div class="onb" [class.onb--listo]="listo()">
    <div class="onb__barra">
      @if (!esUltima()) {
        <button type="button" class="onb__saltar" (click)="saltar()">Saltar</button>
      }
    </div>

    <div #pista class="onb__pista" (scroll)="alDesplazar()">
      @for (pantalla of pantallas; track pantalla.imagen) {
        <article class="onb__pantalla">
          <img class="onb__ilustracion" [src]="pantalla.imagen" alt="" aria-hidden="true" />
          <h1 class="onb__titulo">{{ pantalla.titulo }}</h1>
          <p class="onb__texto">{{ pantalla.texto }}</p>
        </article>
      }
    </div>

    <div class="onb__pie">
      <div class="onb__puntos">
        @for (pantalla of pantallas; track pantalla.imagen; let i = $index) {
          <button
            type="button"
            class="onb__punto"
            [class.onb__punto--activo]="i === actual()"
            [attr.aria-current]="i === actual()"
            [attr.aria-label]="'Ir a la pantalla ' + (i + 1) + ' de ' + pantallas.length"
            (click)="irA(i)"
          ></button>
        }
      </div>

      <ion-button expand="block" class="auth-boton onb__principal" (click)="avanzar()">
        {{ esUltima() ? 'Crear cuenta' : 'Siguiente' }}
      </ion-button>

      <!-- Siempre visible: quien ya tiene cuenta no debería tener que llegar al
           final del onboarding para encontrar el login. -->
      <a class="onb__secundario" routerLink="/login">Ya tengo cuenta</a>
    </div>
  </div>
</ion-content>
