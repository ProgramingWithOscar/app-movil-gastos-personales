services:
  db:
    image: mysql:8.4
    container_name: gastos-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-gastos}
      MYSQL_USER: ${DB_USERNAME:-gastos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3310:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: gastos-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "Gastos Personales"
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      # APP_KEY no se inyecta a propósito: la pone backend/.env, que está
      # montado. Pasarla vacía desde aquí la dejaba definida-pero-vacía en
      # el contenedor, y Dotenv no sobrescribe lo que ya existe, así que la
      # del .env se ignoraba y la app corría sin clave de cifrado.
      APP_URL: http://localhost:8200
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-gastos}
      DB_USERNAME: ${DB_USERNAME:-gastos}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CORS_ALLOWED_ORIGINS: http://localhost:8100,http://10.0.2.2:8100,http://192.168.1.74:8100,http://localhost,https://localhost,capacitor://localhost,ionic://localhost
    # En desarrollo montamos el código del host para no reconstruir la imagen
    # en cada cambio. Para producción, quita este volumen: la imagen ya lleva
    # el código y las dependencias.
    volumes:
      - ./backend:/var/www/html

  nginx-backend:
    image: nginx:1.27-alpine
    container_name: gastos-nginx-backend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8200:80"
    volumes:
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/html:ro

volumes:
  db-data:
