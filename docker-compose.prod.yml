# Despliegue en el VPS.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Diferencias con el compose de desarrollo:
#   · El código va dentro de la imagen, no montado desde el host.
#   · MySQL no publica ningún puerto: solo se llega desde la red interna.
#   · No se publican 80 ni 443: el `main_nginx` del servidor ya los tiene. Este
#     stack se asoma solo en 127.0.0.1:8300 y aquel le hace de proxy.
#   · Nada de valores por defecto en las credenciales: si falta una, falla.

services:
  db:
    image: mysql:8.4
    container_name: gastos-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?falta DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME:?falta DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?falta DB_ROOT_PASSWORD}
    networks:
      - interna
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Sin `ports`: la base de datos no se asoma a internet. Para entrar desde
    # fuera se usa un túnel SSH, no un puerto abierto.

  backend:
    build:
      context: ./backend
    image: gastos-backend:latest
    container_name: gastos-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: 'Gastos Personales'
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: ${APP_KEY:?falta APP_KEY}
      APP_URL: https://${DOMINIO_API:?falta DOMINIO_API}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      # La app nativa manda este origen; ya no hace falta ningún http://
      CORS_ALLOWED_ORIGINS: https://localhost,capacitor://localhost,ionic://localhost
    networks:
      - interna
    volumes:
      # Lo único que debe sobrevivir a un redespliegue: los archivos subidos.
      # Los logs van a stderr, así que los recoge `docker compose logs`.
      - storage:/var/www/html/storage/app

  web:
    build:
      # El contexto es la raíz para poder copiar backend/public.
      context: .
      dockerfile: docker/nginx-prod/Dockerfile
    image: gastos-web:latest
    container_name: gastos-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Solo en loopback, para poder probar desde el propio servidor. Desde
      # internet no se llega aquí: solo a través del main_nginx.
      - '127.0.0.1:${PUERTO_INTERNO:-8300}:80'
    networks:
      - interna
      # La red donde ya vive el main_nginx del servidor. Sin esto, el proxy no
      # puede resolver el nombre `gastos-web`.
      - proxy

networks:
  interna:
    driver: bridge
  proxy:
    external: true
    name: ${RED_PROXY:?falta RED_PROXY}

volumes:
  db-data:
  storage:
